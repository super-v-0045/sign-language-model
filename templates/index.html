<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Typist</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #1e1e28; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .dashboard-container {
            display: flex;
            gap: 24px;
            width: 90%;
            max-width: 1200px;
            align-items: flex-start;
        }

        /* Left Side Card - Video Viewport */
        .card-left {
            flex: 1.1;
            background-color: #252538;
            border-radius: 12px;
            border: 1px solid #33334d;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #33334d;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Floating Status Card Overlay */
        .status-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            background-color: rgba(22, 22, 30, 0.9);
            border: 2px solid #f1c40f;
            border-radius: 10px;
            width: 110px;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #predicted-char {
            color: #f1c40f;
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 4px;
        }

        .status-text {
            color: rgba(255,255,255,0.8);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Right Side Card - Typist & Controls */
        .card-right {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .text-panel {
            background-color: #252538;
            border-radius: 12px;
            border: 1px solid #33334d;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .panel-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .text-output-box {
            width: 100%;
            height: 240px;
            background-color: #1a1a26;
            border-radius: 8px;
            border: 1px solid #2e2e42;
            padding: 16px;
            color: #ffffff;
            font-size: 1.8rem;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            position: relative;
        }

        /* Custom Blinking Caret Simulation */
        .text-output-box::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #fff;
            margin-left: 2px;
        }

        @keyframes blink {
            from, to { color: transparent }
            50% { color: #fff; }
        }

        .controls-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        #btn-space { background-color: #4caf50; }
        #btn-backspace { background-color: #f39c12; }
        #btn-clear { background-color: #e74c3c; }

        .system-status-bar {
            background-color: #252538;
            border-radius: 8px;
            border: 1px solid #33334d;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #2ecc71;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Camera Viewport Card -->
    <div class="card-left">
        <div class="card-header">
            <span>👋</span> Sign Language Typist
        </div>
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            
            <div class="status-overlay">
                <div id="predicted-char">-</div>
                <div class="status-text" id="status-label">Waiting hand...</div>
            </div>
        </div>
    </div>

    <!-- Interface Panel & Actions Card -->
    <div class="card-right">
        <div class="text-panel">
            <div class="panel-label">Your Generated Text</div>
            <div class="text-output-box" id="text-overlay"></div>
        </div>

        <div class="controls-row">
            <button class="btn" id="btn-space">Space [ _ ]</button>
            <button class="btn" id="btn-backspace">Backspace</button>
            <button class="btn" id="btn-clear">Clear All</button>
        </div>

        <div class="system-status-bar" id="system-status">
            System ready. Start signing!
        </div>
    </div>
</div>

<!-- MediaPipe Hands via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const textOverlay = document.getElementById('text-overlay');
    const predictedChar = document.getElementById('predicted-char');
    const statusLabel = document.getElementById('status-label');
    const systemStatus = document.getElementById('system-status');

    let generatedText = '';
    let lastPrediction = null;
    let framesHeld = 0;
    const REQUIRED_FRAMES = 15;
    let predicting = false;

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(async (results) => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(ctx, landmarks, {color: '#FF0000', lineWidth: 1});
            }

            statusLabel.textContent = 'Detecting...';

            if (!predicting) {
                predicting = true;
                await sendLandmarks(results.multiHandLandmarks);
                predicting = false;
            }
        } else {
            predictedChar.textContent = '-';
            statusLabel.textContent = 'Waiting hand...';
            lastPrediction = null;
            framesHeld = 0;
        }
    });

    async function sendLandmarks(multiHandLandmarks) {
        let allLandmarks = [];
        const hand = multiHandLandmarks[0];
        for (const lm of hand) {
            allLandmarks.push({x: lm.x, y: lm.y});
        }

        try {
            const res = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({landmarks: allLandmarks})
            });
            const data = await res.json();
            const predicted = data.prediction;

            if (predicted) {
                predictedChar.textContent = predicted;
                if (predicted === lastPrediction) {
                    framesHeld++;
                } else {
                    framesHeld = 0;
                    lastPrediction = predicted;
                }
                if (framesHeld === REQUIRED_FRAMES) {
                    generatedText += predicted;
                    textOverlay.textContent = generatedText;
                }
            }
        } catch(e) {
            console.error(e);
        }
    }

    const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 640, height: 480
    });

    camera.start().then(() => {
        systemStatus.textContent = "System ready. Start signing!";
    });

    // Control Actions
    document.getElementById('btn-clear').onclick = () => {
        generatedText = '';
        textOverlay.textContent = '';
        lastPrediction = null;
        framesHeld = 0;
    };

    document.getElementById('btn-space').onclick = () => {
        generatedText += ' ';
        textOverlay.textContent = generatedText;
    };

    document.getElementById('btn-backspace').onclick = () => {
        if (generatedText.length > 0) {
            generatedText = generatedText.slice(0, -1);
            textOverlay.textContent = generatedText;
        }
    };
</script>
</body>
</html>
