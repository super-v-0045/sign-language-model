<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Language Detector</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CHANGED: Target the video element instead of img, and mirror it */
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            transform: scaleX(-1);
        }

        /* --- BOTTOM UI PANEL --- */
        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.8) 20%, rgba(0,0,0,1));
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        #text-overlay {
            color: #00FF00;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .current-letter {
            color: #ffcc00;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            padding: 10px 0 20px 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #detection-zone-guide {
            position: absolute;
            bottom: 15%; 
            left: 20%;
            width: 60%;
            height: 40%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            pointer-events: none;
            z-index: 10;
        }

        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .clear-btn:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="captureCanvas" width="640" height="480" style="display:none;"></canvas>

        <div id="detection-zone-guide"></div>

        <div class="bottom-ui">
            <div class="current-letter" id="current-letter">Detecting: None</div>
            <div id="text-overlay">___</div>
            <button class="clear-btn" onclick="clearText()">Clear Text</button>
            <h1>Live Sign Language Detection</h1>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        const textOverlay = document.getElementById('text-overlay');
        const currentLetter = document.getElementById('current-letter');

        // Step 1: Request access to the user's hardware webcam
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, // Forces front camera on mobile
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or unavailable. Please allow camera permissions.");
                console.error(err);
            }
        }

        // Step 2: Grab frames locally, compress them, and post them to Flask
        function sendFrameToServer() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw current video frame onto hidden HTML5 canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Convert frame to compressed base64 image string format
                const imageData = canvas.toDataURL('image/jpeg', 0.6);

                // Send data payload to backend
                fetch('/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                })
                .then(res => res.json())
                .then(data => {
                    // Update UI with the AI response
                    currentLetter.innerText = "Detecting: " + (data.prediction ? data.prediction : "None");
                    textOverlay.innerText = data.accumulated_text ? data.accumulated_text : "___";
                })
                .catch(err => console.error("API Error: ", err));
            }
        }

        function clearText() {
            fetch('/clear_text', { method: 'POST' })
            .then(() => {
                textOverlay.innerText = "___";
            });
        }

        // Initialize camera and start the sending loop
        setupCamera().then(() => {
            // Process a webcam frame every 150ms
            setInterval(sendFrameToServer, 150);
        });
    </script>

</body>
</html>
