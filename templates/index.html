<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Language Detector</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* --- BOTTOM UI PANEL --- */
        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* Gradient makes text readable over the video */
            background: linear-gradient(transparent, rgba(0,0,0,0.8) 20%, rgba(0,0,0,1));
            padding-bottom: env(safe-area-inset-bottom); /* Better for iPhones */
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* The detected sentence display */
        #text-overlay {
            color: #00FF00;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* The Title now at the bottom */
        h1 {
            margin: 0;
            padding: 10px 0 20px 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Visual guide for the detection zone (Middle-Bottom) */
        #detection-zone-guide {
            position: absolute;
            bottom: 15%; /* Lifted slightly to stay above the text */
            left: 20%;
            width: 60%;
            height: 40%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- The camera feed -->
        <img src="{{ url_for('video_feed') }}" alt="Video Feed">

        <!-- The visual guide for hand placement -->
        <div id="detection-zone-guide"></div>

        <!-- Grouped Text and Title at the bottom -->
        <div class="bottom-ui">
            <div id="text-overlay">Waiting...</div>
            <h1>Live Sign Language Detection</h1>
        </div>
    </div>

    <script>
        // Poll the backend for the generated text string
        function updateText() {
            fetch('/get_text')
                .then(res => res.json())
                .then(data => {
                    const el = document.getElementById('text-overlay');
                    if (data.text) {
                        el.innerText = data.text;
                    } else {
                        el.innerText = "___";
                    }
                })
                .catch(err => console.error("Text fetch error:", err));
        }
        setInterval(updateText, 500);
    </script>

</body>
</html>
