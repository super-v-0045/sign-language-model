<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Language Detector</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Displays the processed frames received back from Python */
        #output-frame {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.8) 20%, rgba(0,0,0,1));
            padding-bottom: env(safe-area-inset-bottom); 
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        #text-overlay {
            color: #00FF00;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
            padding: 10px 0 20px 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #detection-zone-guide {
            position: absolute;
            bottom: 15%; 
            left: 20%;
            width: 60%;
            height: 40%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            pointer-events: none;
            z-index: 10;
        }

        /* Keep the raw camera feed hidden */
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="capture-canvas"></canvas>

        <img id="output-frame" alt="Initializing camera stream...">

        <div id="detection-zone-guide"></div>

        <div class="bottom-ui">
            <div id="text-overlay">Waiting for video...</div>
            <h1>Live Sign Language Detection</h1>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('capture-canvas');
        const outputImg = document.getElementById('output-frame');
        const textOverlay = document.getElementById('text-overlay');
        const ctx = canvas.getContext('2d');

        // Request browser webcam access
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                // Once stream metadata loads, match canvas sizes to video scale
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    // Start processing loop
                    sendFrameLoop();
                };
            })
            .catch(err => {
                console.error("Webcam access denied: ", err);
                textOverlay.innerText = "Camera Access Error";
            });

        function sendFrameLoop() {
            // Draw current frame from hidden <video> onto the hidden <canvas>
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Extract frame as a base64 DataURL string
            const frameData = canvas.toDataURL('image/jpeg', 0.6); // 0.6 compresses it for speed

            // POST the frame payload straight to Flask
            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: frameData })
            })
            .then(res => res.json())
            .then(data => {
                // Render the annotated image directly back to the display image element
                if(data.processed_image) outputImg.src = data.processed_image;
                
                // Update text overlays
                textOverlay.innerText = data.text ? data.text : "___";
                
                // Trigger immediate next frame evaluation loop
                requestAnimationFrame(sendFrameLoop);
            })
            .catch(err => {
                console.error("Server communication error:", err);
                // Try again after 1 second if server encounters a momentary drop
                setTimeout(sendFrameLoop, 1000);
            });
        }
    </script>
</body>
</html>
