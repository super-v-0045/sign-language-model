<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Language Detector</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #output-frame {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            position: relative;
            z-index: 5;
        }

        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.8) 20%, rgba(0,0,0,1));
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        #text-overlay {
            color: #00FF00;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin: 0;
            padding: 10px 0 20px 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #detection-zone-guide {
            position: absolute;
            bottom: 25%;
            left: 15%;
            width: 70%;
            height: 45%;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            pointer-events: none;
            z-index: 10;
        }

        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="capture-canvas"></canvas>
        <img id="output-frame" alt="Initializing camera stream...">

        <div id="detection-zone-guide"></div>

        <div class="bottom-ui">
            <div id="text-overlay">Waiting for video...</div>
            <h1>Live Sign Language Detection</h1>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('capture-canvas');
        const outputImg = document.getElementById('output-frame');
        const textOverlay = document.getElementById('text-overlay');
        const ctx = canvas.getContext('2d');

        let isProcessing = false;

        // Start local webcam hardware stream
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 426 }, 
                height: { ideal: 240 },
                facingMode: "user"
            } 
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            
            video.addEventListener('playing', () => {
                // Set lightweight dimensions to ensure packet stays well under Render's 1MB firewall payload cap
                canvas.width = 320;
                canvas.height = 240;
                
                // Continuous loop execution triggers request processing engine blocks smoothly
                tickLoop(); 
            });
        })
        .catch(err => {
            console.error("Webcam blocked:", err);
            textOverlay.style.color = "#FF0000";
            textOverlay.innerText = "Camera Access Blocked or Denied.";
        });

        function tickLoop() {
            // Safety drop logic checks if frame extraction sequence is locked or camera went sleep
            if (isProcessing || video.paused || video.ended) {
                setTimeout(tickLoop, 50); // Pause briefly before checking queue states again
                return;
            }

            isProcessing = true; // Engage processing execution request lock

            // Extract bounding coordinates to invisible memory canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frameData = canvas.toDataURL('image/jpeg', 0.35); // 35% compression quality keeping size at ~35KB

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: frameData })
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP System Error: ${res.status}`);
                return res.json();
            })
            .then(data => {
                // Confirm backend returned real frame arrays
                if (data.processed_image && data.processed_image !== "data:image/jpeg;base64,") {
                    outputImg.src = data.processed_image;
                }
                textOverlay.innerText = data.text ? data.text : "___";
                
                // Fire next execution sequence IMMEDIATELY since previous frame cleared safely
                isProcessing = false;
                setTimeout(tickLoop, 30); 
            })
            .catch(err => {
                console.error("Transmission skip encountered:", err);
                
                // On error, wait 1 second to give your network buffer space to breathe before retrying
                isProcessing = false;
                setTimeout(tickLoop, 1000); 
            });
        }
    </script>
</body>
</html>
